name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Package write access is scoped to the build job.
permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test image retention policy
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run tests
        run: go test ./...

      - name: Build unprivileged OpenSSH test image
        run: docker build -f internal/k8s/testdata/Dockerfile.ssh-test -t voidshell-sshd:test .

      - name: Test direct SSH against OpenSSH
        env:
          VOIDSHELL_TEST_SSH_IMAGE: voidshell-sshd:test
        run: go test ./internal/k8s -run TestDirectSSHOpenSSH -timeout 60s

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files need gofmt:"
            echo "$out"
            exit 1
          fi

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: "4.3.0"

      - name: Lint chart
        run: helm lint charts/voidshell

  image-changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -Ev '(^docs/|\.md$|^LICENSE$)' | grep . >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  scan:
    name: Scan container images
    runs-on: ubuntu-latest
    needs: [test, helm-lint, image-changes]
    if: needs.image-changes.outputs.changed == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build voidshell image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: voidshell:scan
          cache-from: type=gha

      - name: Scan voidshell image
        id: scan-voidshell
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voidshell:scan
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-voidshell.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload voidshell scan results
        if: always() && hashFiles('trivy-voidshell.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-voidshell.sarif
          category: voidshell

      - name: Build workspace image for scanning
        id: build-workspace
        if: always()
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/amd64
          load: true
          tags: voidshell-workspace:scan
          cache-from: type=gha

      - name: Test Homebrew htop with Ghostty terminfo
        if: steps.build-workspace.outcome == 'success'
        run: ./scripts/test-workspace-terminal.sh voidshell-workspace:scan

      - name: Scan workspace image
        id: scan-workspace
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voidshell-workspace:scan
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-workspace.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # SARIF output is intentionally terse. Emit a table as well when the
      # blocking scan finds something, so the failing check is actionable.
      - name: Report workspace scan findings
        if: steps.scan-workspace.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voidshell-workspace:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload workspace scan results
        if: always() && hashFiles('trivy-workspace.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-workspace.sarif
          category: workspace

      - name: Fail on detected vulnerabilities or scan errors
        if: always()
        env:
          VOIDSHELL_SCAN_OUTCOME: ${{ steps.scan-voidshell.outcome }}
          WORKSPACE_SCAN_OUTCOME: ${{ steps.scan-workspace.outcome }}
        run: |
          if [ "$VOIDSHELL_SCAN_OUTCOME" != "success" ] || [ "$WORKSPACE_SCAN_OUTCOME" != "success" ]; then
            echo "One or more image scans failed or found vulnerabilities."
            exit 1
          fi

  build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [test, helm-lint, scan]
    permissions:
      contents: read
      packages: write
    concurrency:
      # Every publisher (main or dispatch) shares the cleanup/release lock.
      group: ${{ github.event_name == 'pull_request' && format('pr-images-{0}', github.event.pull_request.number) || 'ghcr-images' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Required for linux/arm64 cross-compilation in the Dockerfile build stage.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Log in to GHCR only on non-PR runs (PRs from forks don't have write access).
      # Requires packages: write permission declared above.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Push only on main-branch commits, not on PRs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.event_name == 'workflow_dispatch' && format('dev-{0}', github.sha) || 'main' }}
          # Layer cache stored in GitHub Actions cache — correctness does not
          # depend on the cache being present.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build workspace image (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}-workspace:${{ github.sha }}
            ghcr.io/${{ github.repository }}-workspace:${{ github.event_name == 'workflow_dispatch' && format('dev-{0}', github.sha) || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm for development chart publication
        if: github.event_name == 'workflow_dispatch'
        uses: azure/setup-helm@v5
        with:
          version: "4.3.0"

      - name: Publish revision-pinned development chart
        if: github.event_name == 'workflow_dispatch'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          chart_base=$(awk '$1 == "version:" { print $2 }' charts/voidshell/Chart.yaml)
          chart_version="${chart_base}-dev.g${GITHUB_SHA:0:12}"
          helm package charts/voidshell --version "$chart_version" --app-version "$GITHUB_SHA" --destination /tmp
          helm push "/tmp/voidshell-${chart_version}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          printf 'Development chart: `%s`\nImages: `%s`\n' "$chart_version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
